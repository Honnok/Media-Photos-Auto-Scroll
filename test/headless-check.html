<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8" /><title>check</title></head>
<body>
<div id="grid"></div>
<script src="../engine.js"></script>
<script>
  for (let i = 0; i < 80; i++) {
    const a = document.createElement("a");
    a.href = "/photo/?fbid=" + (1000 + i) + "&set=a.1";
    a.style.cssText = "display:block;height:220px;background:#555;margin:6px";
    const img = document.createElement("img");
    img.width = 180;
    img.height = 180;
    img.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
    a.appendChild(img);
    document.getElementById("grid").appendChild(a);
  }
  const controller = window.createPhotoAutoScroll({ onState: function () {} });
  document.documentElement.setAttribute("data-engine", typeof window.createPhotoAutoScroll);
  controller.start();
  setTimeout(function () {
    const s = controller.getState();
    document.documentElement.setAttribute("data-y", String(window.scrollY));
    document.documentElement.setAttribute("data-photos", String(s.photos));
    document.documentElement.setAttribute("data-running", String(s.running));
    document.documentElement.setAttribute("data-status", String(s.status));
    document.title = "y=" + window.scrollY + " photos=" + s.photos + " run=" + s.running;
  }, 2800);
</script>
</body>
</html>
